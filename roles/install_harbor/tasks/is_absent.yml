---
# tasks file for install_harbor — absent

- name: Stop and disable the systemd unit
  ansible.builtin.systemd:
    name: harbor
    state: stopped
    enabled: false
  failed_when: false

- name: Check for the compose file
  ansible.builtin.stat:
    path: "{{ harbor_install_dir }}/docker-compose.yml"
  register: harbor_compose_file

- name: Bring the Harbor services down
  ansible.builtin.command:
    cmd: docker compose down
    chdir: "{{ harbor_install_dir }}"
  when: harbor_compose_file.stat.exists
  changed_when: true

- name: Remove the systemd unit
  ansible.builtin.file:
    path: /etc/systemd/system/harbor.service
    state: absent

- name: Remove the install directory
  ansible.builtin.file:
    path: "{{ harbor_install_dir }}"
    state: absent
  when: harbor_purge_install | bool

- name: Remove the registry data
  ansible.builtin.file:
    path: "{{ harbor_data_volume }}"
    state: absent
  when: harbor_purge_data | bool
