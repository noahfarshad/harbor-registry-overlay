---
# tasks file for install_harbor — present
#
# harbor.yml is created from the template the installer ships, so it always
# carries the keys that Harbor release expects. Only the values below change.

- name: Read the installed Harbor version
  ansible.builtin.slurp:
    src: "{{ harbor_version_marker }}"
  register: harbor_version_file
  failed_when: false

- name: Note the installed version
  ansible.builtin.set_fact:
    harbor_installed_version: "{{ (harbor_version_file.content | b64decode | trim) if harbor_version_file.content is defined else '' }}"

- name: Upgrade the existing release in place
  ansible.builtin.include_tasks: upgrade.yml
  when:
    - harbor_installed_version | length > 0
    - harbor_installed_version != harbor_version

- name: Unpack the installer
  ansible.builtin.unarchive:
    src: "{{ harbor_download_dir }}/{{ harbor_installer_file }}"
    dest: "{{ harbor_install_parent }}"
    remote_src: true
    creates: "{{ harbor_install_dir }}/install.sh"
    owner: root
    group: root

- name: Create the data volume
  ansible.builtin.file:
    path: "{{ harbor_data_volume }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create harbor.yml from the shipped template
  ansible.builtin.copy:
    src: "{{ harbor_install_dir }}/harbor.yml.tmpl"
    dest: "{{ harbor_install_dir }}/harbor.yml"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0600"

- name: Set the values Harbor needs
  ansible.builtin.replace:
    path: "{{ harbor_install_dir }}/harbor.yml"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - regexp: '(?m)^hostname:.*$'
      replace: "hostname: {{ harbor_hostname }}"
    - regexp: '(?m)^(\s{2})port: 80$'
      replace: '\g<1>port: {{ harbor_http_port }}'
    - regexp: '(?m)^(\s{2})port: 443$'
      replace: '\g<1>port: {{ harbor_https_port }}'
    - regexp: '(?m)^(\s{2})certificate:.*$'
      replace: '\g<1>certificate: {{ harbor_tls_cert }}'
    - regexp: '(?m)^(\s{2})private_key:.*$'
      replace: '\g<1>private_key: {{ harbor_tls_key }}'
    - regexp: '(?m)^harbor_admin_password:.*$'
      replace: "harbor_admin_password: {{ harbor_admin_password }}"
    - regexp: '(?m)^(\s{2})password: root123$'
      replace: '\g<1>password: {{ harbor_db_password }}'
    - regexp: '(?m)^data_volume:.*$'
      replace: "data_volume: {{ harbor_data_volume }}"
  loop_control:
    label: "{{ item.regexp }}"
  no_log: true
  notify: Reinstall harbor

- name: Run the Harbor installer
  ansible.builtin.command:
    cmd: "./install.sh{{ ' --with-trivy' if harbor_with_trivy | bool else '' }}"
    chdir: "{{ harbor_install_dir }}"
    creates: "{{ harbor_install_dir }}/docker-compose.yml"
  timeout: 1800

- name: Install the systemd unit
  ansible.builtin.template:
    src: harbor.service.j2
    dest: /etc/systemd/system/harbor.service
    owner: root
    group: root
    mode: "0644"
  when: harbor_manage_systemd | bool

- name: Enable Harbor at boot
  ansible.builtin.systemd:
    name: harbor
    enabled: true
    state: started
    daemon_reload: true
  when: harbor_manage_systemd | bool

- name: Record the installed version
  ansible.builtin.copy:
    content: "{{ harbor_version }}
"
    dest: "{{ harbor_version_marker }}"
    owner: root
    group: root
    mode: "0644"
