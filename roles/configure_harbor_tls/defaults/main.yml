---
# defaults file for configure_harbor_tls

harbor_tls_mode: ipa                        # ipa | staged
harbor_tls_cert: "/etc/pki/tls/certs/{{ harbor_hostname }}.crt"
harbor_tls_key: "/etc/pki/tls/private/{{ harbor_hostname }}.key"

# ipa mode — the host must be an IdM client (ipaclient role) and the service
# principal must exist before the first run.
harbor_tls_principal: "HTTP/{{ harbor_hostname }}"
harbor_tls_ipa_wait_retries: 30
harbor_tls_ipa_wait_delay: 10

# staged mode — certificate and key on attached storage
harbor_tls_staged_cert: "{{ artifact_staging }}/harbor/tls/{{ harbor_hostname }}.crt"
harbor_tls_staged_key: "{{ artifact_staging }}/harbor/tls/{{ harbor_hostname }}.key"
