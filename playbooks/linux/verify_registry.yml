---
# playbooks/linux/verify_registry.yml
#
# Read-only checks on the Harbor registry: services, API health, projects and
# certificate window. Safe to run any time.
#
# Usage:
#   make verify-registry HOST=registry01.example.coach

- name: Verify the Harbor container registry
  hosts: registry
  gather_facts: false
  become: true
  vars:
    desired_state: present

  roles:
    - { role: verify_harbor, tags: [verify] }
