---
# group_vars/registry/main.yml
#
# Harbor registry tier defaults. Release version and checksum live next to this
# file in harbor_artifacts.yml, generated on the connected side.

# ===========================================================================
# Harbor
# ===========================================================================
harbor_artifact_path:       harbor              # sub-path under the repo URL / staging mount
harbor_install_parent:      "{{ install_root }}"
harbor_data_volume:         /data
harbor_http_port:           80
harbor_https_port:          443
harbor_with_trivy:          false               # no vulnerability feed inside the air gap

harbor_admin_password:      "{{ vault_harbor_admin_password }}"
harbor_db_password:         "{{ vault_harbor_db_password }}"

# Projects for the Supervisor Services and VKS content
harbor_projects:
  - name: sup-services
    public: true
  - name: tanzu-packages
    public: true
  - name: tkg
    public: true

# ===========================================================================
# TLS — IdM issues and certmonger renews
# ===========================================================================
harbor_tls_mode:            ipa                 # ipa | staged
harbor_tls_cert:            "/etc/pki/tls/certs/{{ harbor_hostname }}.crt"
harbor_tls_key:             "/etc/pki/tls/private/{{ harbor_hostname }}.key"

# ===========================================================================
# Docker Engine and Compose — never from the internet
# ===========================================================================
docker_offline_source:      yum                 # yum | staged
docker_offline_rpm_path:    "{{ harbor_artifact_path }}/docker"

# ===========================================================================
# Firewall — registry hosts expose 80 and 443 in addition to 22
# ===========================================================================
firewall_open_tcp_ports:
  - 22
  - "{{ harbor_http_port }}"
  - "{{ harbor_https_port }}"
